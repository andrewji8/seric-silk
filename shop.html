<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop — Seric</title>
<meta name="description" content="The full Seric wardrobe: dresses, blouses, scarves, sleep and home, in small-batch mulberry silk.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23231D16'/><text x='16' y='23' font-family='Georgia,serif' font-size='19' fill='%23B08D57' text-anchor='middle'>S</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="shop">
<main>
  <section class="banner">
    <div class="container">
      <p class="eyebrow">The wardrobe</p>
      <h1>Everyday silk</h1>
      <p class="banner-sub">Dress it, sleep it, gift it — the full Seric house, in one room.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="toolbar">
        <div class="filter-btns" id="filter-btns">
          <button class="filter-btn" data-cat="all">All</button>
          <button class="filter-btn" data-cat="dresses">Dresses</button>
          <button class="filter-btn" data-cat="blouses">Blouses &amp; Camis</button>
          <button class="filter-btn" data-cat="scarves">Scarves &amp; Ties</button>
          <button class="filter-btn" data-cat="sleep">Sleep &amp; Lounge</button>
          <button class="filter-btn" data-cat="home">Home &amp; Gifts</button>
        </div>
        <div class="tool-right">
          <span id="shop-count"></span>
          <select id="sort-select" class="sort" aria-label="Sort products">
            <option value="featured">Sort: Featured</option>
            <option value="price-asc">Price: Low to high</option>
            <option value="price-desc">Price: High to low</option>
            <option value="name">Alphabetical</option>
          </select>
        </div>
      </div>
      <div class="product-grid" id="product-grid"></div>
      <p class="center muted" id="shop-empty" style="display:none">Nothing in this room yet — try another.</p>
    </div>
  </section>
</main>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
